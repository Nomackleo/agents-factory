# Template config.yaml for generated ecosystems
ecosystem:
  name: "{{system_name}}"
  version: "1.0.0"

environment:
  type: "production"
  compliance: "soc2-strict"

agents:
  directory: ".agents"
  max_tokens: 4096
  temperature_default: 0.2

metrics:
  dora_tracking: true
  space_tracking: true
